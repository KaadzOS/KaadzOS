name: Deploy site

on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - 'iso-site/**'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    # Cloudflare Pages is the only hosting for the website. The site is built
    # on every run; the deploy steps are skipped until CLOUDFLARE_API_TOKEN and
    # CLOUDFLARE_ACCOUNT_ID exist as repository secrets, so the workflow stays
    # green before hosting is set up.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: site/package-lock.json

      # Build even without Cloudflare credentials so a broken site fails CI
      # before it can reach Pages.
      - name: Install site dependencies
        working-directory: site
        run: npm ci

      - name: Build site
        working-directory: site
        run: npm run build

      - name: Check Cloudflare credentials
        id: gate
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "enabled=1" >> "$GITHUB_OUTPUT"
            echo "Cloudflare credentials present; deploying."
          else
            echo "enabled=0" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set; skipping the Pages deploy."
          fi

      - name: Ensure the Pages project exists
        if: steps.gate.outputs.enabled == '1'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Creating an existing project returns success=false, which is fine:
          # the deploy below is the real check.
          curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data '{"name":"kaadzos","production_branch":"main"}' \
            -o /dev/null -w 'Pages project ensure: HTTP %{http_code}\n' || true

      - name: Deploy to Cloudflare Pages
        if: steps.gate.outputs.enabled == '1'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages deploy site/dist \
            --project-name kaadzos \
            --branch main

      - name: Deploy ISO mirror branch
        # The `iso` preview branch alias is https://iso.kaadzos.pages.dev.
        # iso-site/_worker.js streams the private R2 bucket through the
        # project's R2_BUCKET binding; the production site above stays static.
        if: steps.gate.outputs.enabled == '1'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages deploy iso-site \
            --project-name kaadzos \
            --branch iso
