name: Build ISO

on:
  push:
    branches:
      - main
    tags:
      # Version tags publish a GitHub release after the full validation matrix
      # (build, pack-test, boot-test, install-test) passes for that commit.
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
      options: --privileged

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Disk space (before)
        run: df -h

      - name: Best-effort cleanup
        run: |
          apt-get clean || true
          rm -rf /var/lib/apt/lists/* || true
          df -h

      - name: Install live-build
        run: |
          sed -i 's/^Components: main$/Components: main contrib non-free-firmware/' /etc/apt/sources.list.d/debian.sources
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y live-build

      - name: Verify package availability
        run: |
          while read -r package; do
            case "$package" in
              ""|'#'*) continue ;;
            esac
            apt-cache show "$package" >/dev/null
          done < config/package-lists/base.list.chroot

      - name: Set cache key
        id: cache-key
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Restore package cache
        uses: actions/cache@v6
        with:
          path: cache/packages.chroot
          key: live-build-packages-${{ runner.os }}-${{ steps.cache-key.outputs.week }}-${{ hashFiles('auto/config', 'config/package-lists/*.list.chroot') }}
          restore-keys: |
            live-build-packages-${{ runner.os }}-${{ steps.cache-key.outputs.week }}-
            live-build-packages-${{ runner.os }}-

      - name: Configure live-build
        run: |
          chmod +x auto/config
          ./auto/config

      - name: Stage packs into image
        run: |
          mkdir -p config/includes.chroot/usr/share/kaadzos
          rm -rf config/includes.chroot/usr/share/kaadzos/packs
          cp -r packs config/includes.chroot/usr/share/kaadzos/packs

      - name: Build ISO
        run: lb build

      - name: Prepare artifacts
        run: |
          iso=$(find . -maxdepth 1 -type f -name '*.iso' -print -quit)
          test -n "$iso"
          mv "$iso" KaadzOS-trixie-amd64.iso
          sha256sum KaadzOS-trixie-amd64.iso > KaadzOS-trixie-amd64.iso.sha256
          ls -lh KaadzOS-trixie-amd64.iso KaadzOS-trixie-amd64.iso.sha256

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v7
        with:
          name: KaadzOS-trixie-amd64
          path: |
            KaadzOS-trixie-amd64.iso
            KaadzOS-trixie-amd64.iso.sha256
          compression-level: 0
          if-no-files-found: error

  pack-test:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enable archive areas and refresh indexes
        run: |
          sed -i 's/^Components: main$/Components: main contrib non-free-firmware/' /etc/apt/sources.list.d/debian.sources
          apt-get update

      - name: Verify base package availability
        run: |
          while read -r package; do
            case "$package" in
              ""|'#'*) continue ;;
            esac
            apt-cache show "$package" >/dev/null
          done < config/package-lists/base.list.chroot

      - name: Run pack resolution tests
        run: bash ci/test-packs.sh

  boot-test:
    needs: build
    runs-on: ubuntu-latest
    # 20 minutes was exceeded by a slow runner apt mirror alone (packages were
    # still downloading when the job was cancelled); QEMU then needs its own
    # minutes under TCG, so keep real headroom.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        firmware:
          - bios
          - uefi

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download ISO artifact
        uses: actions/download-artifact@v8
        with:
          name: KaadzOS-trixie-amd64
          path: artifacts

      - name: Verify ISO checksum
        working-directory: artifacts
        run: sha256sum --check KaadzOS-trixie-amd64.iso.sha256

      - name: Install boot-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes qemu-system-x86 ovmf socat netpbm

      - name: Boot ISO with ${{ matrix.firmware }} firmware
        run: bash ci/test-boot.sh "${{ matrix.firmware }}" artifacts/KaadzOS-trixie-amd64.iso boot-results

      - name: Upload ${{ matrix.firmware }} boot diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: boot-${{ matrix.firmware }}
          path: boot-results
          if-no-files-found: warn

      - name: Publish ${{ matrix.firmware }} boot diagnostics
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ ! -d boot-results ]; then
            echo "no boot diagnostics to publish"
            exit 0
          fi
          cd boot-results
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b "ci-artifacts/${{ matrix.firmware }}"
          git add -A
          git commit -qm "boot diagnostics (${{ matrix.firmware }}) @ ${{ github.sha }}"
          git push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/ci-artifacts/${{ matrix.firmware }}"

  install-test:
    needs: build
    runs-on: ubuntu-latest
    # The install phase has a 50-minute deadline and the installed boot up to
    # 10 more; leave room for slow apt mirrors on top.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        firmware:
          - bios
          - uefi

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download ISO artifact
        uses: actions/download-artifact@v8
        with:
          name: KaadzOS-trixie-amd64
          path: artifacts

      - name: Verify ISO checksum
        working-directory: artifacts
        run: sha256sum --check KaadzOS-trixie-amd64.iso.sha256

      - name: Install install-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes qemu-system-x86 qemu-utils ovmf socat netpbm

      - name: Install KaadzOS with ${{ matrix.firmware }} firmware
        run: |
          mkdir -p install-results
          set -o pipefail
          bash ci/test-install.sh "${{ matrix.firmware }}" artifacts/KaadzOS-trixie-amd64.iso install-results 2>&1 | tee install-results/test.log

      - name: Upload ${{ matrix.firmware }} install diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: install-${{ matrix.firmware }}
          path: install-results
          if-no-files-found: warn

      - name: Publish ${{ matrix.firmware }} install diagnostics
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ ! -d install-results ]; then
            echo "no install diagnostics to publish"
            exit 0
          fi
          cd install-results
          # Keep the diagnostics branch small enough for GitHub to accept it;
          # the disk image is large and not needed to read the failure.
          rm -f ./*.qcow2 ./*.fd ./*.ppm
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b "ci-artifacts/install-${{ matrix.firmware }}"
          git add -A
          git commit -qm "install diagnostics (${{ matrix.firmware }}) @ ${{ github.sha }}"
          git push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/ci-artifacts/install-${{ matrix.firmware }}"

  release:
    # Publishing needs proof: the release job waits for the ISO build, the
    # pack resolver, both QEMU boots and both unattended installs of the same
    # commit. It runs only for version tags.
    needs:
      - build
      - pack-test
      - boot-test
      - install-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download ISO artifact
        uses: actions/download-artifact@v8
        with:
          name: KaadzOS-trixie-amd64
          path: artifacts

      - name: Verify ISO checksum
        working-directory: artifacts
        run: sha256sum --check KaadzOS-trixie-amd64.iso.sha256

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="$GITHUB_REF_NAME"
          title="KaadzOS ${tag#v}"
          notes="docs/release-notes/${tag}.md"
          assets=(
            artifacts/KaadzOS-trixie-amd64.iso
            artifacts/KaadzOS-trixie-amd64.iso.sha256
          )

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists; refreshing assets and notes"
            gh release upload "$tag" "${assets[@]}" --clobber
            if [ -f "$notes" ]; then
              gh release edit "$tag" --title "$title" --notes-file "$notes"
            fi
          else
            args=(--title "$title" --verify-tag)
            if [ -f "$notes" ]; then
              args+=(--notes-file "$notes")
            else
              args+=(--generate-notes)
            fi
            gh release create "$tag" "${args[@]}" "${assets[@]}"
          fi

          echo "published release $tag"
          gh release view "$tag" --json url,assets \
            --jq '"\(.url) assets: " + ([.assets[].name] | join(", "))'

      - name: Mirror ISO to Cloudflare R2
        # Optional: enable by setting CLOUDFLARE_ACCOUNT_ID, R2_ACCESS_KEY_ID
        # and R2_SECRET_ACCESS_KEY as repository secrets (and optionally the
        # R2_BUCKET repository variable; it defaults to "kaadzos").
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_BUCKET: ${{ vars.R2_BUCKET || 'kaadzos' }}
        run: |
          set -eu
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ] ||
             [ -z "${AWS_ACCESS_KEY_ID:-}" ] ||
             [ -z "${AWS_SECRET_ACCESS_KEY:-}" ]; then
            echo "R2 credentials are not configured; skipping the mirror."
            echo "Add CLOUDFLARE_ACCOUNT_ID, R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY to enable it."
            exit 0
          fi
          endpoint="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          prefix="s3://${R2_BUCKET}/releases/${GITHUB_REF_NAME}"
          aws s3 cp --endpoint-url "$endpoint" \
            artifacts/KaadzOS-trixie-amd64.iso "$prefix/KaadzOS-trixie-amd64.iso"
          aws s3 cp --endpoint-url "$endpoint" \
            artifacts/KaadzOS-trixie-amd64.iso.sha256 "$prefix/KaadzOS-trixie-amd64.iso.sha256"
          echo "mirrored to $prefix/"
