name: Build ISO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
      options: --privileged

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Disk space (before)
        run: df -h

      - name: Best-effort cleanup
        run: |
          apt-get clean || true
          rm -rf /var/lib/apt/lists/* || true
          df -h

      - name: Install live-build
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y live-build

      - name: Configure live-build
        run: |
          chmod +x auto/config
          ./auto/config

      - name: Build ISO
        run: lb build

      - name: Verify ISO exists
        run: ls -lh *.iso

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: trixie-live-iso
          path: "*.iso"
          if-no-files-found: error
