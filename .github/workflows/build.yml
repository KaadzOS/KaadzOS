name: Build ISO

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
      options: --privileged

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Disk space (before)
        run: df -h

      - name: Best-effort cleanup
        run: |
          apt-get clean || true
          rm -rf /var/lib/apt/lists/* || true
          df -h

      - name: Install live-build
        run: |
          sed -i 's/^Components: main$/Components: main contrib non-free-firmware/' /etc/apt/sources.list.d/debian.sources
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y live-build

      - name: Verify package availability
        run: |
          while read -r package; do
            case "$package" in
              ""|'#'*) continue ;;
            esac
            apt-cache show "$package" >/dev/null
          done < config/package-lists/base.list.chroot

      - name: Set cache key
        id: cache-key
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Restore package cache
        uses: actions/cache@v6
        with:
          path: cache/packages.chroot
          key: live-build-packages-${{ runner.os }}-${{ steps.cache-key.outputs.week }}-${{ hashFiles('auto/config', 'config/package-lists/*.list.chroot') }}
          restore-keys: |
            live-build-packages-${{ runner.os }}-${{ steps.cache-key.outputs.week }}-
            live-build-packages-${{ runner.os }}-

      - name: Configure live-build
        run: |
          chmod +x auto/config
          ./auto/config

      - name: Stage packs into image
        run: |
          mkdir -p config/includes.chroot/usr/share/kaadzos
          rm -rf config/includes.chroot/usr/share/kaadzos/packs
          cp -r packs config/includes.chroot/usr/share/kaadzos/packs

      - name: Build ISO
        run: lb build

      - name: Prepare artifacts
        run: |
          iso=$(find . -maxdepth 1 -type f -name '*.iso' -print -quit)
          test -n "$iso"
          mv "$iso" KaadzOS-trixie-amd64.iso
          sha256sum KaadzOS-trixie-amd64.iso > KaadzOS-trixie-amd64.iso.sha256
          ls -lh KaadzOS-trixie-amd64.iso KaadzOS-trixie-amd64.iso.sha256

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v7
        with:
          name: KaadzOS-trixie-amd64
          path: |
            KaadzOS-trixie-amd64.iso
            KaadzOS-trixie-amd64.iso.sha256
          compression-level: 0
          if-no-files-found: error

  pack-test:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enable archive areas and refresh indexes
        run: |
          sed -i 's/^Components: main$/Components: main contrib non-free-firmware/' /etc/apt/sources.list.d/debian.sources
          apt-get update

      - name: Verify base package availability
        run: |
          while read -r package; do
            case "$package" in
              ""|'#'*) continue ;;
            esac
            apt-cache show "$package" >/dev/null
          done < config/package-lists/base.list.chroot

      - name: Run pack resolution tests
        run: bash ci/test-packs.sh

  boot-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        firmware:
          - bios
          - uefi

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download ISO artifact
        uses: actions/download-artifact@v8
        with:
          name: KaadzOS-trixie-amd64
          path: artifacts

      - name: Verify ISO checksum
        working-directory: artifacts
        run: sha256sum --check KaadzOS-trixie-amd64.iso.sha256

      - name: Install boot-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes qemu-system-x86 ovmf socat netpbm

      - name: Boot ISO with ${{ matrix.firmware }} firmware
        run: bash ci/test-boot.sh "${{ matrix.firmware }}" artifacts/KaadzOS-trixie-amd64.iso boot-results

      - name: Upload ${{ matrix.firmware }} boot diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: boot-${{ matrix.firmware }}
          path: boot-results
          if-no-files-found: warn

      - name: Publish ${{ matrix.firmware }} boot diagnostics
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ ! -d boot-results ]; then
            echo "no boot diagnostics to publish"
            exit 0
          fi
          cd boot-results
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b "ci-artifacts/${{ matrix.firmware }}"
          git add -A
          git commit -qm "boot diagnostics (${{ matrix.firmware }}) @ ${{ github.sha }}"
          git push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/ci-artifacts/${{ matrix.firmware }}"
