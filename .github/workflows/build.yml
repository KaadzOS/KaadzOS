name: Build ISO

on:
  push:
    branches:
      - main
    tags:
      # Version tags publish a GitHub release after the full validation matrix
      # (build, pack-test, boot-test, install-test) passes for that commit.
      - 'v*'
    # Website, ISO-host and documentation edits cannot change the ISO. Path
    # filters are not evaluated for tag pushes, so releases still run every job.
    paths-ignore:
      - 'site/**'
      - 'iso-site/**'
      - '.github/workflows/site.yml'
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
      options: --privileged

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Disk space (before)
        run: df -h

      - name: Best-effort cleanup
        run: |
          apt-get clean || true
          rm -rf /var/lib/apt/lists/* || true
          df -h

      - name: Install live-build
        run: |
          sed -i 's/^Components: main$/Components: main contrib non-free-firmware/' /etc/apt/sources.list.d/debian.sources
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y live-build gnupg \
            g++ qt6-base-dev pkg-config

      - name: Verify package availability
        run: |
          while read -r package; do
            case "$package" in
              ""|'#'*) continue ;;
            esac
            apt-cache show "$package" >/dev/null
          done < config/package-lists/base.list.chroot

      - name: Set cache key
        id: cache-key
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Restore package cache
        uses: actions/cache@v6
        with:
          path: cache/packages.chroot
          key: live-build-packages-${{ runner.os }}-${{ steps.cache-key.outputs.week }}-${{ hashFiles('auto/config', 'config/package-lists/*.list.chroot') }}
          restore-keys: |
            live-build-packages-${{ runner.os }}-${{ steps.cache-key.outputs.week }}-
            live-build-packages-${{ runner.os }}-

      - name: Configure live-build
        run: |
          chmod +x auto/config
          ./auto/config

      - name: Stage packs into image
        run: |
          mkdir -p config/includes.chroot/usr/share/kaadzos
          rm -rf config/includes.chroot/usr/share/kaadzos/packs
          cp -r packs config/includes.chroot/usr/share/kaadzos/packs

      - name: Stage KaadzOS APT repository trust
        # Optional: when the signing key, the R2 publishing credentials and
        # the public URL are configured, the image trusts the signed KaadzOS
        # archive and points apt at it. Without those inputs this is a no-op,
        # so the base image stays independent of the optional repository.
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
        run: |
          if [ -z "${APT_GPG_PRIVATE_KEY:-}" ] ||
             [ -z "${R2_ACCESS_KEY_ID:-}" ] ||
             [ -z "${R2_SECRET_ACCESS_KEY:-}" ] ||
             [ -z "${R2_PUBLIC_URL:-}" ]; then
            echo "APT trust inputs are not configured; the image will not enable the KaadzOS archive."
            exit 0
          fi
          export GNUPGHOME="$(mktemp -d)"
          chmod 700 "$GNUPGHOME"
          printf '%s\n' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          key_id=$(gpg --batch --list-secret-keys --with-colons |
            awk -F: '/^sec:/ {print $5; exit}')
          test -n "$key_id"
          install -d config/includes.chroot/usr/share/keyrings config/hooks/live
          gpg --batch --yes --export "$key_id" \
            > config/includes.chroot/usr/share/keyrings/kaadzos-archive-keyring.gpg
          # The source is written by a chroot hook, after package installation,
          # not staged in includes.chroot. Otherwise lb build would query the
          # archive during its own apt run, which fails on the first tag if the
          # archive has not been published yet. The hook also checks that the
          # published InRelease is reachable before enabling the source.
          cat > config/hooks/live/0700-kaadzos-archive.hook.chroot <<'HOOK'
          #!/bin/sh
          # Generated by CI when the optional KaadzOS archive is configured.
          set -eu

          url='@APT_URL@'

          if ! curl -fsS --max-time 15 -o /dev/null "$url/dists/trixie/InRelease"; then
            echo "kaadzos: archive not reachable at $url; leaving it disabled"
            exit 0
          fi

          install -d /etc/apt/sources.list.d
          cat > /etc/apt/sources.list.d/kaadzos.sources <<SOURCES
          Types: deb
          URIs: $url
          Suites: trixie
          Components: main
          Signed-By: /usr/share/keyrings/kaadzos-archive-keyring.gpg
          SOURCES
          echo "kaadzos: enabled the signed archive at $url"
          HOOK
          sed -i "s|@APT_URL@|${R2_PUBLIC_URL%/}/apt|" \
            config/hooks/live/0700-kaadzos-archive.hook.chroot
          chmod 0755 config/hooks/live/0700-kaadzos-archive.hook.chroot
          ls -l config/includes.chroot/usr/share/keyrings \
                config/hooks/live/0700-kaadzos-archive.hook.chroot

      - name: Build Calamares map filter
        run: sh ci/build-map-filter.sh

      - name: Build ISO
        run: lb build

      - name: Prepare artifacts
        run: |
          iso=$(find . -maxdepth 1 -type f -name '*.iso' -print -quit)
          test -n "$iso"
          mv "$iso" KaadzOS-trixie-amd64.iso
          sha256sum KaadzOS-trixie-amd64.iso > KaadzOS-trixie-amd64.iso.sha256
          ls -lh KaadzOS-trixie-amd64.iso KaadzOS-trixie-amd64.iso.sha256

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v7
        with:
          name: KaadzOS-trixie-amd64
          path: |
            KaadzOS-trixie-amd64.iso
            KaadzOS-trixie-amd64.iso.sha256
          compression-level: 0
          if-no-files-found: error

  pack-test:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enable archive areas and refresh indexes
        run: |
          sed -i 's/^Components: main$/Components: main contrib non-free-firmware/' /etc/apt/sources.list.d/debian.sources
          apt-get update

      - name: Verify base package availability
        run: |
          while read -r package; do
            case "$package" in
              ""|'#'*) continue ;;
            esac
            apt-cache show "$package" >/dev/null
          done < config/package-lists/base.list.chroot

      - name: Run pack resolution tests
        run: bash ci/test-packs.sh

  repo-test:
    # The optional APT repository is validated without Cloudflare credentials:
    # an ephemeral signing key builds a real signed repo and apt installs from
    # it. Publishing is the only credential-gated step.
    runs-on: ubuntu-latest
    container:
      image: debian:trixie

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install repository tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            dpkg-dev apt-utils gnupg gpgv gzip xz-utils ca-certificates

      - name: Build and consume a signed test repository
        run: bash ci/test-apt-repo.sh

  boot-test:
    needs: build
    runs-on: ubuntu-latest
    # 20 minutes was exceeded by a slow runner apt mirror alone (packages were
    # still downloading when the job was cancelled); QEMU then needs its own
    # minutes under TCG, so keep real headroom.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        firmware:
          - bios
          - uefi

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download ISO artifact
        uses: actions/download-artifact@v8
        with:
          name: KaadzOS-trixie-amd64
          path: artifacts

      - name: Verify ISO checksum
        working-directory: artifacts
        run: sha256sum --check KaadzOS-trixie-amd64.iso.sha256

      - name: Install boot-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes qemu-system-x86 ovmf socat netpbm

      - name: Boot ISO with ${{ matrix.firmware }} firmware
        run: bash ci/test-boot.sh "${{ matrix.firmware }}" artifacts/KaadzOS-trixie-amd64.iso boot-results

      - name: Upload ${{ matrix.firmware }} boot diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: boot-${{ matrix.firmware }}
          path: boot-results
          if-no-files-found: warn

      - name: Publish ${{ matrix.firmware }} boot diagnostics
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ ! -d boot-results ]; then
            echo "no boot diagnostics to publish"
            exit 0
          fi
          cd boot-results
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b "ci-artifacts/${{ matrix.firmware }}"
          git add -A
          git commit -qm "boot diagnostics (${{ matrix.firmware }}) @ ${{ github.sha }}"
          git push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/ci-artifacts/${{ matrix.firmware }}"

  install-test:
    needs: build
    runs-on: ubuntu-latest
    # The install phase has a 50-minute deadline and the installed boot up to
    # 10 more; leave room for slow apt mirrors on top.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        firmware:
          - bios
          - uefi

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download ISO artifact
        uses: actions/download-artifact@v8
        with:
          name: KaadzOS-trixie-amd64
          path: artifacts

      - name: Verify ISO checksum
        working-directory: artifacts
        run: sha256sum --check KaadzOS-trixie-amd64.iso.sha256

      - name: Install install-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes qemu-system-x86 qemu-utils ovmf socat netpbm

      - name: Install KaadzOS with ${{ matrix.firmware }} firmware
        run: |
          mkdir -p install-results
          set -o pipefail
          bash ci/test-install.sh "${{ matrix.firmware }}" artifacts/KaadzOS-trixie-amd64.iso install-results 2>&1 | tee install-results/test.log

      - name: Upload ${{ matrix.firmware }} install diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: install-${{ matrix.firmware }}
          path: install-results
          if-no-files-found: warn

      - name: Publish ${{ matrix.firmware }} install diagnostics
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ ! -d install-results ]; then
            echo "no install diagnostics to publish"
            exit 0
          fi
          cd install-results
          # Keep the diagnostics branch small enough for GitHub to accept it;
          # the disk image is large and not needed to read the failure.
          rm -f ./*.qcow2 ./*.fd ./*.ppm
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b "ci-artifacts/install-${{ matrix.firmware }}"
          git add -A
          git commit -qm "install diagnostics (${{ matrix.firmware }}) @ ${{ github.sha }}"
          git push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/ci-artifacts/install-${{ matrix.firmware }}"

  apt-repo:
    # Optional signed APT archive. It publishes only for version tags and only
    # when R2 + signing credentials exist; without them the job is a green
    # no-op. The archive is built from the tagged commit's pack definitions.
    needs:
      - build
      - pack-test
      - repo-test
      - boot-test
      - install-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check publishing credentials
        id: gate
        env:
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_KEY: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          GPG_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
        run: |
          if [ -n "$CF_ACCOUNT" ] && [ -n "$R2_KEY" ] && [ -n "$R2_SECRET" ] &&
             [ -n "$GPG_KEY" ] && [ -n "$PUBLIC_URL" ]; then
            echo "enabled=1" >> "$GITHUB_OUTPUT"
            echo "APT repository publishing is configured."
          else
            echo "enabled=0" >> "$GITHUB_OUTPUT"
            echo "::notice::APT repository publishing is not configured; skipping. Add CLOUDFLARE_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY and APT_GPG_PRIVATE_KEY secrets plus the R2_PUBLIC_URL variable."
          fi

      - name: Install repository tools
        if: steps.gate.outputs.enabled == '1'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev apt-utils gnupg

      - name: Import signing key
        if: steps.gate.outputs.enabled == '1'
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"
          printf '%s\n' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          key_id=$(gpg --batch --list-secret-keys --with-colons |
            awk -F: '/^sec:/ {print $5; exit}')
          test -n "$key_id"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          echo "GPG_KEY_ID=$key_id" >> "$GITHUB_ENV"

      - name: Build kaadzos-pack-defs
        if: steps.gate.outputs.enabled == '1'
        run: |
          version="${GITHUB_REF_NAME#v}"
          bash ci/build-pack-defs.sh "$version" build/debs

      - name: Build signed APT repository
        if: steps.gate.outputs.enabled == '1'
        env:
          GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
          R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
        run: |
          base="${R2_PUBLIC_URL%/}"
          APT_BASE_URL="$base/apt" \
            bash ci/build-apt-repo.sh build/debs build/apt trixie main amd64

      - name: Upload repository to Cloudflare R2
        if: steps.gate.outputs.enabled == '1'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_BUCKET: ${{ vars.R2_BUCKET || 'kaadzos' }}
          R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
        run: |
          set -eu
          endpoint="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          # Keep old pool versions: a client with a stale Packages index can
          # still fetch the version it knows about. Metadata is overwritten.
          aws s3 sync build/apt "s3://${R2_BUCKET}/apt/" \
            --endpoint-url "$endpoint" \
            --cache-control "public, max-age=300"
          echo "published ${R2_PUBLIC_URL%/}/apt/"

      - name: Upload repository artifact
        if: always() && steps.gate.outputs.enabled == '1'
        uses: actions/upload-artifact@v7
        with:
          name: apt-repository
          path: build/apt
          if-no-files-found: warn

  release:
    # Publishing needs proof: the release job waits for the ISO build, the
    # pack resolver, the repository test, both QEMU boots and both unattended
    # installs of the same commit. It runs only for version tags.
    needs:
      - build
      - pack-test
      - repo-test
      - boot-test
      - install-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download ISO artifact
        uses: actions/download-artifact@v8
        with:
          name: KaadzOS-trixie-amd64
          path: artifacts

      - name: Verify ISO checksum
        working-directory: artifacts
        run: sha256sum --check KaadzOS-trixie-amd64.iso.sha256

      - name: Sign the release checksum
        # Optional: the same key that signs the APT archive signs the checksum,
        # so a downloaded ISO can be verified end to end. Without the key the
        # release stays unsigned and this step is a green no-op. Signing runs
        # before publishing so the release never exists without its signature.
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          set -eu
          if [ -z "${APT_GPG_PRIVATE_KEY:-}" ]; then
            echo "::notice::APT_GPG_PRIVATE_KEY is not set; skipping release signing."
            exit 0
          fi
          export GNUPGHOME="$(mktemp -d)"
          chmod 700 "$GNUPGHOME"
          printf '%s\n' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          key_id=$(gpg --batch --list-secret-keys --with-colons |
            awk -F: '/^sec:/ {print $5; exit}')
          test -n "$key_id"
          gpg_args=(--batch --yes --armor --local-user "$key_id")
          if [ -n "${APT_GPG_PASSPHRASE:-}" ]; then
            gpg_args+=(--pinentry-mode loopback --passphrase "$APT_GPG_PASSPHRASE")
          fi
          gpg "${gpg_args[@]}" --detach-sign \
            --output artifacts/KaadzOS-trixie-amd64.iso.sha256.asc \
            artifacts/KaadzOS-trixie-amd64.iso.sha256
          gpg --batch --yes --armor --export "$key_id" \
            > artifacts/kaadzos-archive-keyring.asc
          echo "signed the release checksum"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="$GITHUB_REF_NAME"
          title="KaadzOS ${tag#v}"
          notes="docs/release-notes/${tag}.md"
          assets=(
            artifacts/KaadzOS-trixie-amd64.iso
            artifacts/KaadzOS-trixie-amd64.iso.sha256
          )
          if [ -f artifacts/KaadzOS-trixie-amd64.iso.sha256.asc ]; then
            assets+=(artifacts/KaadzOS-trixie-amd64.iso.sha256.asc)
          fi
          if [ -f artifacts/kaadzos-archive-keyring.asc ]; then
            assets+=(artifacts/kaadzos-archive-keyring.asc)
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists; refreshing assets and notes"
            gh release upload "$tag" "${assets[@]}" --clobber
            if [ -f "$notes" ]; then
              gh release edit "$tag" --title "$title" --notes-file "$notes"
            fi
          else
            args=(--title "$title" --verify-tag)
            if [ -f "$notes" ]; then
              args+=(--notes-file "$notes")
            else
              args+=(--generate-notes)
            fi
            gh release create "$tag" "${args[@]}" "${assets[@]}"
          fi

          echo "published release $tag"
          gh release view "$tag" --json url,assets \
            --jq '"\(.url) assets: " + ([.assets[].name] | join(", "))'

      - name: Mirror ISO to Cloudflare R2
        # Optional: enable by setting CLOUDFLARE_ACCOUNT_ID, R2_ACCESS_KEY_ID
        # and R2_SECRET_ACCESS_KEY as repository secrets (and optionally the
        # R2_BUCKET repository variable; it defaults to "kaadzos").
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_BUCKET: ${{ vars.R2_BUCKET || 'kaadzos' }}
          R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
        run: |
          set -eu
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ] ||
             [ -z "${AWS_ACCESS_KEY_ID:-}" ] ||
             [ -z "${AWS_SECRET_ACCESS_KEY:-}" ]; then
            echo "R2 credentials are not configured; skipping the mirror."
            echo "Add CLOUDFLARE_ACCOUNT_ID, R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY to enable it."
            exit 0
          fi
          endpoint="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          prefix="s3://${R2_BUCKET}/releases/${GITHUB_REF_NAME}"
          aws s3 cp --endpoint-url "$endpoint" \
            artifacts/KaadzOS-trixie-amd64.iso "$prefix/KaadzOS-trixie-amd64.iso"
          aws s3 cp --endpoint-url "$endpoint" \
            artifacts/KaadzOS-trixie-amd64.iso.sha256 "$prefix/KaadzOS-trixie-amd64.iso.sha256"
          if [ -f artifacts/KaadzOS-trixie-amd64.iso.sha256.asc ]; then
            aws s3 cp --endpoint-url "$endpoint" \
              artifacts/KaadzOS-trixie-amd64.iso.sha256.asc \
              "$prefix/KaadzOS-trixie-amd64.iso.sha256.asc"
          fi
          if [ -f artifacts/kaadzos-archive-keyring.asc ]; then
            aws s3 cp --endpoint-url "$endpoint" \
              artifacts/kaadzos-archive-keyring.asc \
              "$prefix/kaadzos-archive-keyring.asc"
          fi
          echo "mirrored to $prefix/"
          if [ -n "${R2_PUBLIC_URL:-}" ]; then
            echo "public: ${R2_PUBLIC_URL%/}/releases/${GITHUB_REF_NAME}/"
          fi
