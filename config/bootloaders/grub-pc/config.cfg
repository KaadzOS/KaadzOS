# KaadzOS override of live-build's grub-pc/config.cfg. Identical to the
# template (fonts, gfxmode, theme source, terminal output, startup ding),
# with one addition: boot the default entry after five seconds instead of
# waiting for a keypress (#1069 fast-boot tuning).
set default=0
set timeout=5
set timeout_style=menu

if [ x$feature_default_font_path = xy ] ; then
    font=unicode
else
    font=$prefix/unicode.pf2
fi

# Copied from the netinst image
if loadfont $font ; then
    set gfxmode=800x600
    set gfxpayload=keep
    insmod efi_gop
    insmod efi_uga
    insmod video_bochs
    insmod video_cirrus
else
    set gfxmode=auto
    insmod all_video
fi

insmod gfxterm
insmod png

source /boot/grub/theme.cfg

terminal_output gfxterm

insmod play
play 960 440 1 0 4 440 1
