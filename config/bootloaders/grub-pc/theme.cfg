# KaadzOS Night GRUB menu colours (override of live-build's grub-pc/theme.cfg;
# copied into binary/boot/grub by live-build because config/bootloaders files
# are applied after its templates).
set color_normal=light-gray/black
set color_highlight=white/dark-gray

if [ -e /boot/grub/splash.png ]; then
    set theme=/boot/grub/live-theme/theme.txt
else
    set menu_color_normal=black/black
    set menu_color_highlight=white/black
fi
