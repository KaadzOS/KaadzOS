# CI-only Calamares settings. The build hook copies /etc/calamares to
# /etc/calamares-ci and overlays this file and the CI module configs.
---
modules-search: [ local, /usr/lib/calamares/modules ]

oem-setup: false
disable-cancel: true
disable-cancel-during-exec: true
quit-at-end: true
prompt-install: false
dont-chroot: false

instances:
  - id: kaadzos-exec-marker
    module: shellprocess
    config: kaadzos-exec-marker.conf
  - id: kaadzos-cleanup
    module: shellprocess
    config: kaadzos-cleanup.conf
  - id: kaadzos-finalize
    module: shellprocess
    config: kaadzos-finalize.conf

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary

  - exec:
      - kaadzos-exec-marker
      - partition
      - mount
      - unpackfs
      - kaadzos-cleanup
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - users
      - displaymanager
      - networkcfg
      - hwclock
      - services-systemd
      - bootloader
      - grubcfg
      - initramfs
      - kaadzos-finalize
      - umount

  - show:
      - finished

branding: kaadzos
