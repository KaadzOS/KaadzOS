# CI users page: fixed names and password, autologin enabled so the installed
# system can be observed without a greeter interaction.
---
userGroup: users

defaultGroups:
    - cdrom
    - floppy
    - sudo
    - audio
    - dip
    - video
    - plugdev
    - netdev
    - lpadmin
    - scanner
    - bluetooth
    - dialout

autologinGroup: ""
sudoersGroup: sudo

setRootPassword: false
doReusePassword: false
doAutologin: true

passwordRequirements:
    minLength: 8
    maxLength: -1

allowWeakPasswords: false
allowWeakPasswordsDefault: false

user:
    shell: /bin/bash
    forbidden_names: [ root ]
    home_permissions: "o700"

hostname:
    location: EtcFile
    writeHostsFile: true
    template: "kaadzos-${cpu}"
    forbidden_names: [ localhost ]

allowActiveDirectory: false

presets:
    fullName:
        value: "KaadzOS"
        editable: true
    loginName:
        value: "kaadzos"
        editable: true
