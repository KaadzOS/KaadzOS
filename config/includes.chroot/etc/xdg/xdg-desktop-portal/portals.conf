# KaadzOS portal backend selection. The GTK backend handles file pickers,
# notifications and the general desktop integration; the wlroots backend
# handles screen casting and screenshots on Sway. Backend names match the
# gtk.portal and wlr.portal files shipped by the two packages.
[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
