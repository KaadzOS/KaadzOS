# greetd is the installed-session login manager. Debian ships the greeter
# account as _greetd (the Calamares defaults, "greeter"/"greetd", do not exist
# on Debian), and the Sway wrapper is used for both greeter-launched and
# autologin sessions.
---
displaymanagers:
    - greetd

basicSetup: false
sysconfigSetup: false

defaultDesktopEnvironment:
    executable: "/usr/local/bin/kaadzos-sway-session"
    desktopFile: "sway"

greetd:
    greeter_user: "_greetd"
    greeter_group: "_greetd"
