# Keep the serial console available on the installed system so the QEMU CI
# test can observe the session; the live image uses the same cmdline.
---
overwrite: false
prefer_grub_d: false
keep_distributor: false
kernel_params:
    - "quiet"
    - "splash"
    - "console=tty0"
    - "console=ttyS0,115200n8"

defaults:
    # Fast boot: the installed menu blinks by in one second.
    GRUB_TIMEOUT: 1
    GRUB_DEFAULT: "saved"
    GRUB_DISABLE_SUBMENU: true
    GRUB_TERMINAL_OUTPUT: "console"
    GRUB_DISABLE_RECOVERY: true
