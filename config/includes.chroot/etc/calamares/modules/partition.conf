# KaadzOS partitioning. Full-disk erase, install alongside an existing
# system, and manual partitioning are all available. LUKS encryption is
# offered on the automated pages and in manual partitioning.
---
efi:
    mountPoint: "/boot/efi"
    recommendedSize: 512MiB
    minimumSize: 100MiB
    label: "EFI"

userSwapChoices:
    - none
    - small
    - file

# GRUB in trixie can unlock LUKS1 without extra initramfs help. LUKS2 with
# argon2id is not reliably readable by GRUB, so keep the conservative format.
luksGeneration: luks1
enableLuksAutomatedPartitioning: true
allowManualPartitioning: true
showNotEncryptedBootMessage: true
requiredStorage: 8
allowZfsEncryption: false

drawNestedPartitions: false
alwaysShowPartitionLabels: true
initialPartitioningChoice: none
initialSwapChoice: none
defaultFileSystemType: "ext4"
availableFileSystemTypes: [ ext4 ]
lvm:
    enable: false
