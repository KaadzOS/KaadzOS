# KaadzOS welcome page. No network-dependent checks: the live image ships
# everything needed to install offline.
---
showSupportUrl: false
showKnownIssuesUrl: false
showReleaseNotesUrl: false
showDonateUrl: false

requirements:
    requiredStorage: 8.0
    requiredRam: 1.0
    check:
        - storage
        - ram
        - root
    required:
        - storage
        - ram
        - root

geoip:
    style: "none"
    url: "https://geoip.kde.org/v1/ubiquity"
    selector: "CountryCode"
