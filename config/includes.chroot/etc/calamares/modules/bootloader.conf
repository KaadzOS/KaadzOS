# Install GRUB for both firmware types. The target disk and firmware are
# detected by Calamares from the way the live ISO booted.
---
efiBootLoader: "grub"
grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"
efiBootloaderId: "KaadzOS"
installEFIFallback: true
