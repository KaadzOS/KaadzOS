# Enable the installed-system services. greetd was disabled in the live
# image; enabling it here makes graphical.target start the login manager.
---
units:
    - name: "NetworkManager.service"
      action: "enable"
      mandatory: true
    - name: "greetd.service"
      action: "enable"
      mandatory: true
    - name: "kaadzos-firstboot.service"
      action: "enable"
      mandatory: true
