# KaadzOS user creation.
---
userGroup: users

defaultGroups:
    - cdrom
    - floppy
    - sudo
    - audio
    - dip
    - video
    - plugdev
    - netdev
    - lpadmin
    - scanner
    - bluetooth
    # Needed for the installed-session diagnostic writer on /dev/ttyS0.
    - dialout

# greetd does not need an autologin group. Leaving this empty also means the
# "log in automatically" checkbox on the users page works without a groupadd.
autologinGroup: ""
sudoersGroup: sudo

setRootPassword: false
doReusePassword: false
doAutologin: false

passwordRequirements:
    minLength: 8
    maxLength: -1

allowWeakPasswords: false
allowWeakPasswordsDefault: false

user:
    shell: /bin/bash
    forbidden_names: [ root ]
    home_permissions: "o700"

hostname:
    location: EtcFile
    writeHostsFile: true
    template: "kaadzos-${cpu}"
    forbidden_names: [ localhost ]

allowActiveDirectory: false

presets:
    fullName:
        editable: true
    loginName:
        editable: true
