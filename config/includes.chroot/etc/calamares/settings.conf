# KaadzOS Calamares settings.
#
# The ISO is installed by unpacking the live squashfs onto the target, then
# removing the live-only packages and configuration before the initramfs is
# regenerated. A CI variant of this directory is staged at /etc/calamares-ci
# by a build hook (see config/hooks/live/0500-calamares-ci.hook.chroot).
---
modules-search: [ local, /usr/lib/calamares/modules ]

oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
quit-at-end: false
prompt-install: true
dont-chroot: false

# Installer-only shellprocess instances. Each one has its own config file in
# modules/; the ids are referenced from the sequence below.
instances:
  - id: kaadzos-exec-marker
    module: shellprocess
    config: kaadzos-exec-marker.conf
  - id: kaadzos-cleanup
    module: shellprocess
    config: kaadzos-cleanup.conf
  - id: kaadzos-finalize
    module: shellprocess
    config: kaadzos-finalize.conf

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary

  - exec:
      # Custom instances must be referenced as <module>@<id>: a bare name
      # would mean the implicit instance kaadzos-exec-marker@kaadzos-exec-
      # marker, i.e. a module type that does not exist, and Calamares would
      # refuse to start.
      - shellprocess@kaadzos-exec-marker
      - partition
      - mount
      - unpackfs
      # Purge live-boot/live-config before the initramfs module runs: live-config
      # diverts update-initramfs, so regenerating an initramfs before the purge
      # produces an unbootable installed system.
      - shellprocess@kaadzos-cleanup
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - users
      - displaymanager
      - networkcfg
      - hwclock
      - services-systemd
      - bootloader
      - grubcfg
      - initramfs
      # Remove the live user's passwordless sudo, the CI configuration and the
      # installer helpers from the target; /etc/calamares itself is kept until
      # first boot so the branding files stay available.
      - shellprocess@kaadzos-finalize
      - umount

  - show:
      - finished

branding: kaadzos
