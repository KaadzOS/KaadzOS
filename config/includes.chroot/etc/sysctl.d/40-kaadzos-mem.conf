# KaadzOS memory tuning; pairs with the zram swap configured in
# /etc/default/zramswap. Swappiness above 100 is meaningful since Linux 5.8:
# it weights anonymous pages so the kernel prefers zram over file cache
# eviction. page-cluster=0 trades readahead batching for lower latency on
# compressed swap.
vm.swappiness = 180
vm.page-cluster = 0
